[plugin_settings."0x1ce/mpris-lyrics"]
preferPlayerLyrics = true

[plugin_settings."h465855hgg/lyrics"]
animation = "cascade"
char_width = 4
double_line = false
font_style = "fixed"
font_weight = "light"
karaoke_enabled = false
lyrics_sources = [ "spotify", "lrclib", "netease", "splayer", "qqmusic", "kugou", "qishui", "apple_music", "musixmatch" ]
max_chars = 40
max_lines = 2
poll_interval_ms = 100
translation_language = "en"

[plugin_settings."raycursive/discord-voice"]
discord_binary = "/usr/bin/vesktop"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "dotnetrob/cat",
    "yuuto/arch-updater",
    "dragged/cider",
    "weinguyen/procmon",
    "goatnath/spotify-lyrics",
    "tmelik/system-monitor",
