    [bar.bar]
    center = []
    enabled = false
    end = []
    position = "bottom"
    start = []

        [bar.bar.monitor.DP-1]
        center = []
        enabled = false

    [bar.default]
    background_opacity = 0.72999998368322849
    border = "primary"
    border_width = 0.5
    center = [ "cat", "clock" ]
    concave_edge_corners = false
    end = [ "tray", "clipboard", "network", "bluetooth", "volume", "notifications", "widget", "launcher", "session" ]
