    name = "personal"

[shell]
app_icon_colorize = true
avatar_path = "/home/mattie/Wallpapers/Icons/mattie.png"
font_family = "Inter"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Tokyo-Night"
community_palette = "Jiva Paper"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "kitty" ]
    community_ids = [ "spicetify", "heroiclauncher", "steam", "rofi", "fastfetch" ]

[wallpaper]
directory = "~/Wallpapers/"
directory_dark = "~/Wallpapers/"
directory_light = "~/Wallpapers/"
per_monitor_directories = true

    [wallpaper.default]
    path = "/home/mattie/Wallpapers/Bottom/nier1.jpg"

    [wallpaper.last]
    path = "/home/mattie/Wallpapers/Top/mattie.jpg"

    [wallpaper.monitor.DP-1]
    directory = "~/Wallpapers/Bottom"
    directory_dark = "~/Wallpapers/Bottom/"
    directory_light = "~/Wallpapers/Bottom/"

    [wallpaper.monitor.HDMI-A-1]
    directory = "~/Wallpapers/Top/"
    directory_dark = "~/Wallpapers/Top/"
    directory_light = "~/Wallpapers/Top/"

    [wallpaper.monitors.DP-1]
    path = "/home/mattie/Wallpapers/Bottom/nier1.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mattie/Wallpapers/Top/mattie.jpg"

[weather]
